name: Deploy to AWS
# Every push to main that passes Web CI (lint, tests, build) is deployed to the
# stage named by the repository variable DEPLOY_STAGE (default: staging). A v*
# tag deploys production; "Run workflow" deploys any stage by hand.
#
# Authenticates with GitHub OIDC - no AWS keys are stored in GitHub. Until the
# repository variable AWS_DEPLOY_ROLE_ARN is set (docs/DEPLOY.md §4), the job
# is skipped instead of failing.
on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage to deploy
        required: true
        default: staging
permissions:
  id-token: write
  contents: read
concurrency:
  # One deploy per stage at a time; a newer push waits rather than cancelling
  # a deploy halfway through.
  group: deploy-${{ github.event.inputs.stage || (startsWith(github.ref, 'refs/tags/') && 'production') || vars.DEPLOY_STAGE || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    # From CI: only a successful run for a push to main (not a PR's run).
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.event.inputs.stage || (startsWith(github.ref, 'refs/tags/') && 'production') || vars.DEPLOY_STAGE || 'staging' }}
      SST_TELEMETRY_DISABLED: "1"
      CI: "true"
      LUNA_DATA: ${{ vars.LUNA_DATA }}
      ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
      LUNA_DOMAIN: ${{ vars.LUNA_DOMAIN }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    environment: ${{ github.event.inputs.stage || (startsWith(github.ref, 'refs/tags/') && 'production') || vars.DEPLOY_STAGE || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI passed, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Deploying a stage that holds data without LUNA_DATA=true would delete
      # its database, table and bucket. Refuse instead.
      - name: Guard data stages
        run: |
          case "$STAGE" in
            data-test|production)
              if [ "$LUNA_DATA" != "true" ]; then
                echo "::error::Stage $STAGE holds data. Set the repository variable LUNA_DATA=true, or this deploy would delete it."
                exit 1
              fi ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm ci
      # CI already checked a workflow_run commit; tags and manual runs weren't.
      - if: github.event_name != 'workflow_run'
        run: npm run lint && npm test
      - run: npm run build:agent
      - run: npx sst deploy --stage "$STAGE"
      - name: Smoke test the deployed site
        run: npm run smoke:site "$(node -p "require('./.sst/outputs.json').url")"
