name: Deploy to AWS
# main -> staging, a v* tag -> production, or run by hand for any stage.
# Authenticates with GitHub OIDC - no AWS keys are stored in GitHub. Until the
# repository variable AWS_DEPLOY_ROLE_ARN is set (see docs/DEPLOY.md), the job
# is skipped instead of failing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage to deploy
        required: true
        default: staging
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-${{ github.event.inputs.stage || (startsWith(github.ref, 'refs/tags/') && 'production') || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.event.inputs.stage || (startsWith(github.ref, 'refs/tags/') && 'production') || 'staging' }}
      SST_TELEMETRY_DISABLED: "1"
      LUNA_DATA: ${{ vars.LUNA_DATA }}
      ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
      LUNA_DOMAIN: ${{ vars.LUNA_DOMAIN }}
    environment: ${{ github.event.inputs.stage || (startsWith(github.ref, 'refs/tags/') && 'production') || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm ci
      - run: npm test
      - run: npx sst deploy --stage "$STAGE"
